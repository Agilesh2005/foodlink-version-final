<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Food</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="hdr"></header>

    <div class="box">
        <h2>CLAIM FORM</h2>
        <p class="center" id="what"></p>

        <form onsubmit="return submitClaim(event)">
            <div style="display:flex; flex-direction:column; gap:12px; max-width:440px; margin:0 auto 16px;">
                <input id="un" type="text" placeholder="NGO / Representative Name" required pattern="[A-Za-z\s]+" title="Enter valid name" style="padding:10px 14px; font-size:15px; border:1px solid #cbd5e1; border-radius:6px;">
                <input id="uph" type="tel" placeholder="Contact Phone Number" required pattern="[6-9][0-9]{9}" title="Enter 10-digit phone number" style="padding:10px 14px; font-size:15px; border:1px solid #cbd5e1; border-radius:6px;">
                <input id="um" type="email" placeholder="Official Email Address" required title="Enter valid email" style="padding:10px 14px; font-size:15px; border:1px solid #cbd5e1; border-radius:6px;">
            </div>
            <div class="center"><button type="submit" style="padding:10px 28px; font-size:15px;">Confirm Claim</button></div>
        </form>
    </div>

    <script src="app.js"></script>
    <script>
        let fid = sessionStorage.getItem("fid");
        start();

        async function start(){
            let me = await requireRole("ngo");
            if(me == null){ return; }
            showNav();

            // fill the name and email from the login
            document.getElementById("un").value = me.name;
            if (me.email) {
                document.getElementById("um").value = me.email;
            }

            let food = await api("/api/food/approved");
            let item = food.find(function(x){ return x._id == fid; });

            if(item == null || item.status != "available"){
                window.location.href = "home.html";
            }else{
                document.getElementById("what").innerHTML =
                    "You are claiming: <b>"+esc(item.name)+"</b> ("+item.servings+" servings)";
            }
        }

        async function submitClaim(e){
            e.preventDefault();

            // the server checks again, in case someone else claimed it meanwhile
            let data = await api("/api/food/"+fid+"/claim", "POST", {
                name:  document.getElementById("un").value,
                phone: document.getElementById("uph").value,
                mail:  document.getElementById("um").value,
                kind: "NGO"
            });

            if(!data.ok){
                showNotice("This food listing has already been claimed or is no longer available.", "Notice", "error", function(){ window.location.href = "home.html"; });
                return false;
            }
            window.location.href = "myreg.html";
            return false;
        }
    </script>
</body>
</html>
